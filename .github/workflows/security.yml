name: Repository Security

# Runs for every change (no path filter): secrets can leak anywhere and workflows guard the whole repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (secrets in git history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan git history
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif"

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    env:
      ZIZMOR_VERSION: 1.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit GitHub Actions workflows
        run: pipx run --spec "zizmor==${ZIZMOR_VERSION}" zizmor --format=github .github/
        env:
          # Enables online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
