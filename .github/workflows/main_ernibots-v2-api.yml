name: Build and deploy Python app to Azure Web App - ernibots-v2-api

on:
  push:
    branches:
      - main
    paths:
      - 'GameBackEnd/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd GameBackEnd
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ernibots-v2-api'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CE51A63514AB4DFB829F90649E0AC227 }}
          package: ./GameBackEnd
