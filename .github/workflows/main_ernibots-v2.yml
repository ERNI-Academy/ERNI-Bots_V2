name: Deploy Next.js + Flask to Azure

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./web/package-lock.json

      - name: Build Next.js
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip \
            web \
            GameBackEnd \
            startup.sh \
            -x "*.git*" \
            -x "web/node_modules/*" \
            -x "GameBackEnd/__pycache__/*" \
            -x "GameBackEnd/.venv/*" \
            -x "GameBackEnd/*.db"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ernibots-v2'
          slot-name: 'Production'
          package: release.zip
          startup-command: 'bash /home/site/wwwroot/startup.sh'
