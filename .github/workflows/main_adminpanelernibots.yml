name: Deploy Singularity Admin Panel Web to Azure Web App

on:
  push:
    branches: ["main"]
    paths:
      - 'AdminPanelWeb/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./AdminPanelWeb/package-lock.json
      
      - name: npm install, build, and test
        working-directory: ./AdminPanelWeb
        run: |
          npm install
          npm run build

      - name: Zip artifact for deployment
        working-directory: ./AdminPanelWeb
        run: |
          zip -r ../release.zip . -x "*.git*" ".next/*" "node_modules/*"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Adminpanelernibots'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E3DC9697CA1240869DBB9CC1A555BB84 }}


