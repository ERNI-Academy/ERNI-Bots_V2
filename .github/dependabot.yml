version: 2

# Updates wait 7 days after publication: most malicious package releases are detected and pulled within that window.
updates:
  - package-ecosystem: npm
    directories:
      - /web
      - /AdminPanelWeb
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades are done manually:
      # - @types/node: must match the Node.js runtime line (20 in CI and on Azure).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directories:
      - /GameBackEnd
      - /AgenticService
      - /AdminPanel
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
